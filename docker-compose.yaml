# Production stack for Coolify (Docker Compose deployment) or plain `docker compose up -d`.
# Set the variables from .env.example in Coolify's Environment Variables screen.
# Only `web` should be given a public domain; Postgres and Redis are never exposed.

x-app: &app
  build: .
  image: socialdesk:latest
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgresql://socialdesk:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/socialdesk
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
    STORAGE_LOCAL_DIR: /data/storage
  volumes:
    - storage:/data/storage

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: socialdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: socialdesk
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U socialdesk -d socialdesk']
      interval: 10s
      timeout: 5s
      retries: 10
    # Modest settings for a small VPS; tune to your RAM.
    command: ['postgres', '-c', 'shared_buffers=128MB', '-c', 'max_connections=50']

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ requires noeviction; AOF keeps queued jobs across restarts.
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction', '--maxmemory', '256mb']
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migrate:
    <<: *app
    restart: 'no'
    command: ['sh', '-c', 'npx prisma migrate deploy && npx tsx prisma/seed.ts']
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    command: ['npm', 'run', 'start']
    ports:
      - '3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 768m

  worker:
    <<: *app
    command: ['node', 'dist/worker.cjs']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Let in-flight publishes finish before the container is killed.
    stop_grace_period: 90s
    mem_limit: 512m

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://socialdesk:${POSTGRES_PASSWORD}@postgres:5432/socialdesk
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./scripts/backup/run.sh:/run.sh:ro
      - backups:/backups
    entrypoint: ['/bin/sh', '/run.sh']
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
  redis:
  storage:
  backups:
